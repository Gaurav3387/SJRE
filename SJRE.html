            };

            return (
                <div className="flex flex-col bg-[#1e1e1e] text-[#d4d4d4] rounded-lg overflow-hidden border border-gray-700 font-mono text-sm mt-4 shadow-inner">
                    <div className="bg-[#252526] px-4 py-1.5 border-b border-[#333333] flex justify-between items-center text-xs text-gray-400">
                        <span>{language === 'python' ? '🐍 Python' : language === 'sql' ? '🛢️ SQL' : '💻 Terminal'}</span>
                        <span>Syntova IDE</span>
                    </div>
                    <div className="flex relative min-h-[250px]">
                        <div className="w-10 bg-[#1e1e1e] border-r border-[#333333] text-gray-600 text-right pr-2 py-4 select-none flex flex-col">
                            {[...Array(15)].map((_, i) => <span key={i} className="leading-6">{i + 1}</span>)}
                        </div>
                        <textarea
                            value={value || ""}
                            onChange={(e) => onChange(e.target.value)}
                            onKeyDown={handleKeyDown}
                            spellCheck="false"
                            className="flex-grow bg-transparent text-[#9cdcfe] p-4 outline-none resize-y leading-6 whitespace-pre min-h-[250px]"
                            placeholder={`// Start coding ${language}...`}
                            style={{ caretColor: '#d4d4d4' }}
                        />
                    </div>
                </div>
            );
        };

        // Text Editor for Theory
        const TextEditor = ({ value, onChange }) => {
            return (
                <div className="mt-4">
                    <textarea
                        value={value || ""}
                        onChange={(e) => onChange(e.target.value)}
                        className="w-full bg-gray-800 text-gray-200 p-4 rounded-lg border border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none resize-y min-h-[150px] font-sans leading-relaxed shadow-inner"
                        placeholder="Type your explanation or analysis here..."
                    />
                </div>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [view, setView] = useState('landing');
            const [examType, setExamType] = useState(null);
            const [termReason, setTermReason] = useState("");
            
            const [activePhaseIndex, setActivePhaseIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(10800); // 3 hours in seconds
            const [showSubmitModal, setShowSubmitModal] = useState(false);
            const [showIncompleteModal, setShowIncompleteModal] = useState(false);
            const [incompleteCount, setIncompleteCount] = useState(0);
            
            const videoRef = useRef(null);
            const streamRef = useRef(null);

            const terminateExam = useCallback((reason) => {
                setTermReason(reason);
                setView('terminated');
                if (streamRef.current) {
                    streamRef.current.getTracks().forEach(track => track.stop());
                }
            }, []);

            useEffect(() => {
                if (view !== 'exam') return;

                let strictModeActive = false;
                
                // Grace period: allow 1.5s for fullscreen transition and component mounting 
                // before attaching the deadly focus-loss and blur triggers.
                const strictTimer = setTimeout(() => {
                    strictModeActive = true;
                }, 1500);

                const startWebcam = async () => {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                        streamRef.current = stream;
                        if (videoRef.current) {
                            videoRef.current.srcObject = stream;
                        }
                        // Check if stream drops
                        stream.getVideoTracks()[0].onended = () => {
                            terminateExam("Webcam feed was interrupted or stopped.");
                        };
                    } catch (err) {
                        terminateExam("Webcam access is required for strict proctoring.");
                    }
                };
                startWebcam();

                const handleVisibilityChange = () => {
                    if (strictModeActive && document.hidden) {
                        terminateExam("Tab switching or minimization detected.");
                    }
                };

                const handleBlur = () => {
                    // Check document.hasFocus() to prevent false positives in embedded iframes
                    if (strictModeActive && !document.hasFocus()) {
                        terminateExam("Window lost focus. Ensure you do not click outside the exam window.");
                    }
                };

                const handleClipboard = (e) => { 
                    e.preventDefault(); 
                    if (strictModeActive) terminateExam("Clipboard usage detected (Copy/Paste).");
                };

                const handleContextMenu = (e) => {
                    e.preventDefault();
                    if (strictModeActive) terminateExam("Context menu access prohibited.");
                };
                
                document.addEventListener("visibilitychange", handleVisibilityChange);
                window.addEventListener("blur", handleBlur);
                document.addEventListener("contextmenu", handleContextMenu);
                document.addEventListener("copy", handleClipboard);
                document.addEventListener("paste", handleClipboard);

                return () => {
                    clearTimeout(strictTimer);
                    document.removeEventListener("visibilitychange", handleVisibilityChange);
                    window.removeEventListener("blur", handleBlur);
                    document.removeEventListener("contextmenu", handleContextMenu);
                    document.removeEventListener("copy", handleClipboard);
                    document.removeEventListener("paste", handleClipboard);
                    
                    if (streamRef.current) {
                        streamRef.current.getTracks().forEach(track => track.stop());
                    }
                };
            }, [view, terminateExam]);

            // Timer Effect
            useEffect(() => {
                if (view !== 'exam') return;
                const timerId = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timerId);
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timerId);
            }, [view]);

            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
                const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${h}:${m}:${s}`;
            };

            const startExam = (type) => {
                setExamType(type);
                setView('exam');
                setActivePhaseIndex(0);
                try {
                    document.documentElement.requestFullscreen().catch(e => console.log("Fullscreen request failed", e));
                } catch(e){}
            };

            const handleAnswerChange = (qId, val) => {
                setAnswers(prev => ({ ...prev, [qId]: val }));
            };

            const handleAutoFill = () => {
                const currentData = EXAM_DATA[examType];
                const allQuestions = currentData.phases.flatMap(p => p.questions);
                const newAnswers = { ...answers };
                allQuestions.forEach(q => {
                    if (!newAnswers[q.id] || newAnswers[q.id].trim() === '') {
                        newAnswers[q.id] = q.type === 'code' ? '-- Auto-filled code --' : 'Auto-filled text answer.';
                    }
                });
                setAnswers(newAnswers);
            };

            const handleSubmitRequest = () => {
                const currentData = EXAM_DATA[examType];
                const allQuestions = currentData.phases.flatMap(p => p.questions);
                const unanswered = allQuestions.filter(q => !answers[q.id] || answers[q.id].trim() === '');
                
                if (unanswered.length > 0) {
                    setIncompleteCount(unanswered.length);
                    setShowIncompleteModal(true);
                } else {
                    setShowSubmitModal(true);
                }
            };

            const confirmSubmit = async () => {
                setShowSubmitModal(false);
                
                // --- Generate DOCX ---
                try {
                    const currentData = EXAM_DATA[examType];
                    const docChildren = [];
                    
                    // Add Title
                    docChildren.push(new docx.Paragraph({
                        text: `Syntova Job Readiness Examination - ${currentData.title}`,
                        heading: docx.HeadingLevel.HEADING_1,
                    }));
                    
                    // Add Timestamp
                    docChildren.push(new docx.Paragraph({
                        text: `Date Submitted: ${new Date().toLocaleString()}`,
                        spacing: { after: 400 }
                    }));
                    
                    // Loop through Phases and Questions
                    currentData.phases.forEach((phase, index) => {
                        docChildren.push(new docx.Paragraph({
                            text: `Phase ${index + 1}: ${phase.title}`,
                            heading: docx.HeadingLevel.HEADING_2,
                            spacing: { before: 400, after: 200 }
                        }));
                        
                        phase.questions.forEach((q) => {
                            docChildren.push(new docx.Paragraph({
                                text: q.title,
                                heading: docx.HeadingLevel.HEADING_3,
                                spacing: { before: 200, after: 100 }
                            }));
                            
                            const answerText = answers[q.id] || "No answer provided.";
                            // Split by lines to maintain line breaks and formatting
                            const answerLines = answerText.split('\n');
                            
                            answerLines.forEach(line => {
                                docChildren.push(new docx.Paragraph({
                                    children: [
                                        new docx.TextRun({
                                            text: line,
                                            font: q.type === 'code' ? "Courier New" : "Arial",
                                            size: 20 // 10pt size (20 half-points)
                                        })
                                    ]
                                }));
                            });
                        });
                    });

                    // Construct the document
                    const doc = new docx.Document({
                        sections: [{
                            properties: {},
                            children: docChildren,
                        }],
                    });

                    // Pack and trigger download
                    const blob = await docx.Packer.toBlob(doc);
                    window.saveAs(blob, "Syntova_Exam_Submission.docx");
                } catch (error) {
                    console.error("Document generation failed:", error);
                }
                // --- End Generate DOCX ---

                // Proceed with submission state
                setView('submitted');
                if (streamRef.current) {
                    streamRef.current.getTracks().forEach(track => track.stop());
                }
            };

            const cancelSubmit = () => {
                setShowSubmitModal(false);
            };

            if (view === 'terminated') {
                return (
                    <div className="min-h-screen bg-red-600 flex flex-col items-center justify-center text-white p-8 text-center no-select fixed inset-0 z-50">
                        <Icons.Lock />
                        <h1 className="text-5xl font-extrabold mt-6 mb-4 tracking-wider">EXAM TERMINATED</h1>
                        <p className="text-xl font-semibold mb-8 bg-red-800 px-6 py-3 rounded-lg shadow-lg border border-red-500 max-w-2xl">
                            {termReason}
                        </p>
                        <div className="max-w-xl bg-black/20 p-6 rounded-lg backdrop-blur-sm border border-white/20">
                            <h2 className="text-lg font-bold mb-2">Proctoring Incident Logged</h2>
                            <p className="text-red-100 text-sm">
                                This strict violation has been permanently recorded and reported to the Syntova recruitment team. Your session is locked and cannot be resumed.
                            </p>
                        </div>
                    </div>
                );
            }

            if (view === 'submitted') {
                return (
                    <div className="min-h-screen bg-gray-900 flex flex-col items-center justify-center text-white p-8 text-center no-select fixed inset-0 z-50">
                        <div className="text-emerald-500 mb-6 scale-[2]"><Icons.CheckCircle /></div>
                        <h1 className="text-4xl md:text-5xl font-extrabold mt-4 mb-4 tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">
                            Exam Submitted Successfully
                        </h1>
                        <p className="text-lg text-gray-400 max-w-xl bg-gray-800/50 p-6 rounded-xl border border-gray-700 shadow-inner">
                            Thank you for completing the Syntova Job Readiness Examination. Your responses and proctoring logs have been securely uploaded for review.
                        </p>
                        <p className="mt-8 text-sm font-semibold text-gray-500 uppercase tracking-widest">
                            You may now safely close this window.
                        </p>
                    </div>
                );
            }

            if (view === 'landing') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-gray-900 text-gray-200 p-4 font-sans">
                        <div className="bg-gray-800 p-10 rounded-2xl shadow-2xl max-w-4xl w-full text-center border-t-4 border-blue-500 relative overflow-hidden border border-gray-700">
                            <div className="absolute top-[-50px] right-[-50px] w-32 h-32 bg-blue-900 rounded-full blur-3xl opacity-30"></div>
                            
                            <img src="Logo.png" alt="Syntova Logo" className="h-16 mx-auto mb-8 brightness-200" onError={(e) => {
                                e.target.onerror = null; e.target.style.display = 'none';
                            }}/>
                            
                            <h1 className="text-3xl md:text-4xl font-bold text-white mb-2">Job Readiness Examination</h1>
                            <p className="text-gray-400 mb-10 text-sm tracking-wide">SECURE ASSESSMENT PORTAL &bull; OCT 2026</p>

                            <div className="bg-red-900/30 border-l-4 border-red-500 p-4 mb-10 text-left rounded shadow-sm text-sm text-red-200 flex items-start">
                                <div className="mt-1 mr-3"><Icons.AlertTriangle /></div>
                                <div>
                                    <strong className="text-red-400 block mb-1">STRICT PROCTORING ACTIVE</strong>
                                    <ul className="list-disc pl-5 mt-1 space-y-1">
                                        <li>Webcam recording is mandatory throughout the session.</li>
                                        <li>Navigating away, minimizing, or clicking outside the window triggers auto-termination.</li>
                                        <li>Copy, paste, and context menus are disabled.</li>
                                    </ul>
                                </div>
                            </div>

                            <div className="grid md:grid-cols-2 gap-6">
                                <button onClick={() => startExam('tech')} className="group relative p-6 bg-gray-900 border border-gray-700 rounded-xl hover:border-blue-500 hover:shadow-[0_0_20px_rgba(59,130,246,0.3)] transition-all text-left">
                                    <h3 className="text-xl font-bold text-white mb-2 flex items-center justify-between">Technical Degree <span className="text-blue-500">&rarr;</span></h3>
                                    <p className="text-sm text-gray-400">Python, SQL, Backend, Data Eng.</p>
                                </button>
                                <button onClick={() => startExam('nonTech')} className="group relative p-6 bg-gray-900 border border-gray-700 rounded-xl hover:border-emerald-500 hover:shadow-[0_0_20px_rgba(16,185,129,0.3)] transition-all text-left">
                                    <h3 className="text-xl font-bold text-white mb-2 flex items-center justify-between">Non-Technical Degree <span className="text-emerald-500">&rarr;</span></h3>
                                    <p className="text-sm text-gray-400">Data Analyst, Excel, Power BI.</p>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            const currentData = EXAM_DATA[examType];
            const activePhase = currentData.phases[activePhaseIndex];

            return (
                <div className="h-screen flex flex-col bg-gray-900 text-gray-300 no-select overflow-hidden font-sans">
                    {/* Header */}
                    <header className="bg-gray-950 border-b border-gray-800 h-16 flex items-center justify-between px-6 shrink-0 z-10">
                        <div className="flex items-center space-x-4">
                            <img src="Logo.png" alt="Syntova" className="h-8 brightness-200" onError={(e) => { e.target.style.display='none' }} />
                            <span className="font-bold text-white hidden md:block">Syntova Secure Exam</span>
                            <span className="bg-blue-900 text-blue-200 text-xs font-semibold px-2.5 py-1 rounded border border-blue-700">
                                {examType === 'tech' ? 'Technical' : 'Data Analyst'} Track
                            </span>
                        </div>
                        
                        <div className="flex items-center space-x-4">
                            <div className="text-right pr-2">
                                <p className="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Time Remaining</p>
                                <p className="text-xl font-mono font-bold text-red-500">{formatTime(timeLeft)}</p>
                            </div>
                            <button onClick={handleAutoFill} className="bg-gray-700 hover:bg-gray-600 text-gray-300 text-xs font-bold py-2 px-4 rounded shadow border border-gray-600 transition-colors">
                                Dev: Auto-Fill
                            </button>
                            <button onClick={handleSubmitRequest} className="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold py-2 px-6 rounded shadow transition-colors">
                                Submit Exam
                            </button>
                        </div>
                    </header>

                    {/* Main Layout */}
                    <main className="flex-1 flex overflow-hidden">
                        
                        {/* Sidebar: Navigation */}
                        <div className="w-72 bg-gray-950 border-r border-gray-800 flex flex-col">
                            <div className="p-4 border-b border-gray-800">
                                <h2 className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-2">Sections</h2>
                                <p className="text-xs text-gray-500">Complete all phases. Auto-saves locally.</p>
                            </div>
                            <div className="overflow-y-auto flex-1 p-2 space-y-1">
                                {currentData.phases.map((phase, idx) => (
                                    <button 
                                        key={phase.id}
                                        onClick={() => setActivePhaseIndex(idx)}
                                        className={`w-full text-left p-3 rounded-lg text-sm font-semibold transition-colors flex items-center justify-between
                                            ${activePhaseIndex === idx ? 'bg-blue-900 text-white border-l-4 border-blue-500' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'}`}
                                    >
                                        <span className="truncate pr-2">Phase {idx + 1}</span>
                                        {answers[phase.questions[0].id] && <span className="text-emerald-500"><Icons.CheckCircle /></span>}
                                    </button>
                                ))}
                            </div>
                            
                            {/* PIP Webcam */}
                            <div className="p-4 bg-gray-900 border-t border-gray-800 flex flex-col items-center relative">
                                <div className="absolute top-4 left-4 right-4 bg-red-600 text-white text-[10px] font-bold text-center uppercase tracking-widest z-10 opacity-90 rounded-t-md py-0.5">Recording</div>
                                <video 
                                    ref={videoRef} 
                                    autoPlay 
                                    playsInline 
                                    muted 
                                    className="w-full h-36 object-cover rounded-md border-2 border-gray-700 bg-black shadow-lg"
                                />
                            </div>
                        </div>

                        {/* Content Area: Questions & Editors */}
                        <div className="flex-1 overflow-y-auto bg-gray-900 p-8 scroll-smooth pb-32">
                            <div className="max-w-4xl mx-auto">
                                <div className="mb-8 border-b border-gray-700 pb-4">
                                    <h1 className="text-2xl font-extrabold text-white mb-2">{activePhase.title}</h1>
                                    <p className="text-sm text-blue-400 font-semibold">Maximum Marks: {activePhase.maxMarks}</p>
                                </div>

                                <div className="space-y-12">
                                    {activePhase.questions.map((q) => (
                                        <div key={q.id} className="bg-gray-800 rounded-xl border border-gray-700 p-6 shadow-xl relative">
                                            <div className="absolute top-6 right-6 bg-gray-700 text-gray-300 text-xs font-bold px-3 py-1 rounded shadow-sm">
                                                {q.marks} Marks
                                            </div>
                                            <h3 className="text-lg font-bold text-white mb-4 pr-20">{q.title}</h3>
                                            <div className="text-sm text-gray-300 whitespace-pre-wrap font-sans leading-relaxed mb-6 bg-gray-900 p-4 rounded-lg border border-gray-800">
                                                {q.text}
                                            </div>

                                            {/* Answer Section */}
                                            <div className="mt-4">
                                                <label className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 block">
                                                    Your Answer {q.type === 'code' ? `(${q.language.toUpperCase()})` : '(Text)'}
                                                </label>
                                                {q.type === 'code' ? (
                                                    <CodeEditor 
                                                        language={q.language} 
                                                        value={answers[q.id]} 
                                                        onChange={(val) => handleAnswerChange(q.id, val)}
                                                    />
                                                ) : (
                                                    <TextEditor 
                                                        value={answers[q.id]} 
                                                        onChange={(val) => handleAnswerChange(q.id, val)}
                                                    />
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* Submit Confirmation Modal */}
                    {showSubmitModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm">
                            <div className="bg-gray-800 border border-gray-700 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center">
                                <h2 className="text-2xl font-bold text-white mb-3">Submit Exam?</h2>
                                <p className="text-gray-400 mb-8 text-sm leading-relaxed">
                                    Are you sure you want to submit your examination? You will not be able to return to your answers.
                                </p>
                                <div className="flex justify-center space-x-4">
                                    <button onClick={cancelSubmit} className="px-6 py-2.5 rounded-lg font-bold text-gray-300 bg-gray-700 hover:bg-gray-600 transition-colors border border-gray-600">
                                        Cancel
                                    </button>
                                    <button onClick={confirmSubmit} className="px-6 py-2.5 rounded-lg font-bold text-white bg-emerald-600 hover:bg-emerald-500 transition-colors shadow-[0_0_15px_rgba(16,185,129,0.4)]">
                                        Yes, Submit Final
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Incomplete Questions Modal */}
                    {showIncompleteModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm">
                            <div className="bg-gray-800 border border-red-700 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center">
                                <div className="flex justify-center mb-4 text-red-500 scale-125"><Icons.AlertTriangle /></div>
                                <h2 className="text-2xl font-bold text-white mb-3">Incomplete Exam</h2>
                                <p className="text-gray-400 mb-8 text-sm leading-relaxed">
                                    You have <strong className="text-red-400">{incompleteCount}</strong> unanswered question(s). All questions are compulsory. Please complete them before submitting.
                                </p>
                                <button onClick={() => setShowIncompleteModal(false)} className="px-8 py-2.5 rounded-lg font-bold text-white bg-blue-600 hover:bg-blue-500 transition-colors shadow-lg">
                                    Return to Exam
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
